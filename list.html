<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>List</h1> 
    <h2>Ordered list</h2>
    <h1>List of countries</h1>
    <ol>
    <li>Kenya</li>
    <li>Uganda</li>
    <li>Rwanda</li>
    </ol>
    <h1>Unordered list</h1>
    <h2>List of fruits</h2>
    <ul>
    <li>Mango</li>
    <li>Strawberry</li>
    <li>Apple</li>
    </ul>
    <h1>Descriptive List</h1>
    <dl>
    <dt>Apple</dt>
    <dd>A round red fruit</dd>
    <dt>Banana</dt>
    <dd>A yellow curve shaped fruit</dd>
    </dl>

</body>
</html>
